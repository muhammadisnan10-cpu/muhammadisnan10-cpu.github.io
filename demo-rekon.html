<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Dashboard Rekon — Data Dummy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --card-bg: #fff; --border: #e6e1d6; --border-soft: #efeae0;
    --text: #201e1a; --text-muted: #726c60; --text-faint: #a29b8b;
    --navy: #17233d; --navy-2: #1e3358; --navy-soft: #eaeef5;
    --teal: #0f8a7c; --teal-dark: #0b6d62; --teal-bg: #e0f2ee; --chart-teal: #049688;
    --gold: #c1861f; --gold-bg: #faf0da;
    --green: #1a7d4f; --green-bg: #e2f4e9; --blue-bg: #e7edfa; --blue-text: #2c4f9e;
    --orange: #b3540b; --orange-bg: #fbead9; --red: #b3271e; --red-bg: #fbe7e4; --gray-bg: #efece4;
    --shadow-sm: 0 1px 2px rgba(23,35,61,.06); --shadow-md: 0 6px 18px rgba(23,35,61,.10);
    --font-heading: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .demo-bar { background: #f3c871; color: #3d2c06; font-size: 12.5px; font-weight: 600; padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: center; }
  .demo-bar a { text-decoration: underline; }

  .topbar { background: var(--navy); border-bottom: 2px solid var(--gold); }
  .topbar-in { max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px 28px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 11px; font: 700 17px/1.1 var(--font-heading); color: #fff; text-decoration: none; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--teal); display: grid; place-items: center; font: 700 13px 'Plus Jakarta Sans'; }
  .topnav { display: flex; gap: 26px; flex-wrap: wrap; }
  .topnav a { text-decoration: none; color: rgba(255,255,255,.62); font-weight: 600; font-size: 14px; padding: 4px 0; border-bottom: 2px solid transparent; }
  .topnav a:hover { color: #fff; }
  .topnav a.active { color: #fff; border-bottom-color: var(--teal); }
  .mitra { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 8px 12px; font: 600 13px inherit; }

  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font: 600 28px/1.2 var(--font-heading); letter-spacing: -.01em; margin-bottom: 5px; }
  h2 { font: 600 19px/1.3 var(--font-heading); margin-bottom: 14px; }
  .subtitle { color: var(--text-muted); margin-bottom: 22px; }
  .crumb { font-size: 13px; color: var(--text-muted); text-decoration: none; display: inline-block; margin-bottom: 10px; }
  .crumb:hover { color: var(--teal-dark); }

  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-box { position: relative; overflow: hidden; background: var(--card-bg); border: 1px solid var(--border-soft); border-top: 3px solid var(--teal); border-radius: 10px; padding: 17px 19px; box-shadow: var(--shadow-sm); }
  .stat-box::after { content: ''; position: absolute; top: -34px; right: -34px; width: 92px; height: 92px; border-radius: 50%; background: var(--teal); opacity: .08; }
  .stat-box.navy { border-top-color: var(--navy-2); } .stat-box.navy::after { background: var(--navy-2); }
  .stat-box.green { border-top-color: var(--green); } .stat-box.green::after { background: var(--green); }
  .stat-box .label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .stat-box .label svg { width: 15px; height: 15px; flex: none; }
  .stat-box .value { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat-box .sub { font-size: 12px; color: var(--text-faint); }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 22px; box-shadow: var(--shadow-sm); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar h2 { margin: 0; }
  .card-note { font-size: 12.5px; color: var(--text-muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--teal); color: #fff; border: 1px solid var(--teal); border-radius: 9px; padding: 9px 16px; font: 700 13.5px 'Plus Jakarta Sans'; cursor: pointer; text-decoration: none; transition: background .15s; }
  .btn:hover { background: var(--teal-dark); }
  .btn.secondary { background: #fff; color: var(--text); border-color: var(--border); }
  .btn.secondary:hover { background: var(--bg); }
  .btn.sm { padding: 7px 12px; font-size: 12.5px; }
  .btn-icon { width: 36px; height: 36px; display: grid; place-items: center; background: #fff; border: 1px solid var(--border); border-radius: 9px; color: var(--text-faint); cursor: not-allowed; }
  .btn-icon svg { width: 17px; height: 17px; }

  .periode-list { list-style: none; display: grid; gap: 12px; }
  .periode-list li { display: flex; justify-content: space-between; align-items: center; gap: 14px 20px; flex-wrap: wrap; border: 1px solid var(--border-soft); border-radius: 12px; padding: 16px 18px; }
  .periode-name { font: 600 17px var(--font-heading); text-decoration: none; }
  .periode-name:hover { color: var(--teal-dark); }
  .meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .ok { color: var(--green); font-weight: 700; }
  .periode-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .amount { text-align: right; font-weight: 800; }
  .amount small { font-weight: 500; color: var(--text-muted); font-size: 12px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .b-green { background: var(--green-bg); color: var(--green); } .b-blue { background: var(--blue-bg); color: var(--blue-text); }
  .b-orange { background: var(--orange-bg); color: var(--orange); } .b-red { background: var(--red-bg); color: var(--red); }
  .b-gray { background: var(--gray-bg); color: var(--text-muted); } .b-teal { background: var(--teal-bg); color: var(--teal-dark); }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .pill { text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; min-width: 150px; cursor: pointer; font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .pill:hover { border-color: var(--teal); }
  .pill.on { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-bg); }
  .pill .count { font-size: 22px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pill .sub { font-size: 11.5px; color: var(--text-muted); }
  .sec-label { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters input { flex: 1 1 220px; max-width: 320px; border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font: inherit; background: #fff; }
  .chip-on { display: inline-flex; gap: 8px; align-items: center; background: var(--teal-bg); color: var(--teal-dark); font-size: 12.5px; font-weight: 700; padding: 5px 6px 5px 12px; border-radius: 99px; }
  .chip-on button { border: 0; background: rgba(11,109,98,.15); color: inherit; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-weight: 800; line-height: 1; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border-soft); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #faf8f3; text-align: left; padding: 10px 12px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; border-bottom: 1px solid var(--border); }
  th button { all: unset; cursor: pointer; }
  th button:hover { color: var(--teal-dark); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fcfbf8; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--text-muted); }
  .pager div { display: flex; gap: 8px; }

  .linechart-wrap { position: relative; }
  .linechart { width: 100%; height: auto; display: block; }
  .tip { position: absolute; pointer-events: none; background: var(--navy); color: #fff; font-size: 12px; padding: 8px 11px; border-radius: 8px; transform: translate(-50%, -110%); white-space: nowrap; opacity: 0; transition: opacity .1s; }
  .legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 18px; }
  .form-grid label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .form-grid select, .form-grid input { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; font: inherit; background: #fff; }
  .file { border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px 16px; color: var(--text-muted); font-size: 13px; background: #fdfcf9; }
  .file b { color: var(--text); display: block; }
  .steps { list-style: none; display: grid; gap: 10px; margin-top: 8px; }
  .steps li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border-soft); border-radius: 10px; color: var(--text-faint); }
  .steps li.run { color: var(--text); border-color: var(--teal); background: var(--teal-bg); }
  .steps li.done { color: var(--green); }
  .steps .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
  .steps li.run .ic { border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal { position: fixed; inset: 0; background: rgba(23,35,61,.55); display: grid; place-items: center; padding: 20px; z-index: 50; }
  .modal[hidden] { display: none; }
  .paper { background: #fff; width: min(640px, 100%); max-height: 90vh; overflow: auto; border-radius: 10px; padding: 36px 40px; box-shadow: var(--shadow-md); }
  .paper h3 { font: 700 16px var(--font-heading); text-align: center; letter-spacing: .04em; }
  .paper .no { text-align: center; color: var(--text-muted); font-size: 12.5px; margin-bottom: 18px; }
  .paper p { font-size: 13.5px; margin-bottom: 10px; }
  .paper table { margin: 12px 0 14px; border: 1px solid var(--border); } .paper td { border-color: var(--border); }
  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; margin-top: 26px; font-size: 13px; }
  .sign div > span { display: block; height: 54px; }
  .paper-actions { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-muted); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; transform: translateX(-50%); }

  .note { background: var(--gold-bg); border: 1px solid #efd8a3; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #6b4e14; margin-top: 14px; }

  @media (max-width: 640px) {
    main { padding: 22px 16px 48px; } .topbar-in { padding: 12px 16px; } .card { padding: 18px 16px; }
    .topnav { gap: 18px; } h1 { font-size: 24px; } .paper { padding: 26px 20px; }
    .periode-actions { width: 100%; } .amount { text-align: left; margin-right: auto; }
  }
</style>
</head>
<body>

<div class="demo-bar">
  <span>DEMO · Seluruh data di halaman ini adalah data dummy yang dibuat otomatis di browser.</span>

</div>

<script>
/* ============ Util ============ */
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const rp  = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const num = n => Math.round(n).toLocaleString("id-ID");
const short = n => n >= 1e6 ? (n / 1e6).toFixed(0) + " jt" : num(n);
const $ = s => document.querySelector(s);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pickW(r, items) { let t = items.reduce((a, b) => a + b[1], 0) * r(), s = 0; for (const it of items) { s += it[1]; if (t <= s) return it[0]; } return items[0][0]; }
function terbilang(n) {
  const s = ["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  n = Math.floor(n);
  if (n < 12) return s[n];
  if (n < 20) return terbilang(n - 10) + " belas";
  if (n < 100) return terbilang(Math.floor(n / 10)) + " puluh" + (n % 10 ? " " + terbilang(n % 10) : "");
  if (n < 200) return "seratus" + (n % 100 ? " " + terbilang(n % 100) : "");
  if (n < 1e3) return terbilang(Math.floor(n / 100)) + " ratus" + (n % 100 ? " " + terbilang(n % 100) : "");
  if (n < 2e3) return "seribu" + (n % 1e3 ? " " + terbilang(n % 1e3) : "");
  if (n < 1e6) return terbilang(Math.floor(n / 1e3)) + " ribu" + (n % 1e3 ? " " + terbilang(n % 1e3) : "");
  if (n < 1e9) return terbilang(Math.floor(n / 1e6)) + " juta" + (n % 1e6 ? " " + terbilang(n % 1e6) : "");
  return terbilang(Math.floor(n / 1e9)) + " miliar" + (n % 1e9 ? " " + terbilang(n % 1e9) : "");
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); }

/* ============ Data dummy (deterministik) ============ */
const PAKET = [["20 Mbps", 165000, 20], ["30 Mbps", 235000, 38], ["50 Mbps", 310000, 25], ["100 Mbps", 420000, 13], ["200 Mbps", 650000, 4]];
const KET = [["Lis_bill", 78], ["Lis_bill_sales", 4], ["Lis_bill_PDA", 2], ["Lis Omset", 3], ["Unbilled", 7], ["New Unbilled", 3], ["New Unbilled Sales", 3]];
const KET_CLASS = { "Lis_bill": "b-green", "Lis_bill_sales": "b-blue", "Lis_bill_PDA": "b-blue", "Lis Omset": "b-teal", "Unbilled": "b-orange", "New Unbilled": "b-red", "New Unbilled Sales": "b-orange" };
const TREN = { Naik: ["b-green", "▲"], Turun: ["b-red", "▼"], Sama: ["b-gray", "●"], Baru: ["b-blue", "★"] };
const UNBILLED = k => k.includes("Unbilled");

function genRows(seed, n, year, month) {
  const r = rng(seed), rows = [];
  for (let i = 0; i < n; i++) {
    const [pk, price] = (() => { const x = pickW(r, PAKET.map(p => [p, p[2]])); return [x[0], x[1]]; })();
    const ket = pickW(r, KET), billed = !UNBILLED(ket);
    const baru = r() < 0.12;
    const shared = billed ? price * (0.9 + r() * 0.1) : 0;
    const b2b = billed ? price * 0.05 : 0, wsa = billed ? price * 0.15 : 0, telkom = billed ? shared * 0.28 : 0;
    const psb = ket === "Lis_bill_sales" ? 150000 : 0, pda = ket === "Lis_bill_PDA" ? 100000 : 0;
    const mitra = billed ? shared - telkom - b2b - wsa + psb + pda : 0;
    const d = baru ? new Date(year, month, 1 + Math.floor(r() * 27)) : new Date(year, month - 1 - Math.floor(r() * 34), 1 + Math.floor(r() * 27));
    const tren = baru ? "Baru" : pickW(r, [["Sama", 72], ["Naik", 14], ["Turun", 14]]);
    rows.push({
      sn: String(5500000000 + seed * 7919 + i * 37).slice(0, 10), paket: pk,
      sto: "STO-0" + (1 + Math.floor(r() * 8)), odp: "ODP-0" + (1 + Math.floor(r() * 8)) + "-" + String(1 + Math.floor(r() * 120)).padStart(3, "0"),
      b2b, wsa, shared, telkom, psb, pda, mitra, tgl: d.toISOString().slice(0, 10),
      lalu: baru ? "—" : pickW(r, [["Lis_bill", 85], ["Unbilled", 10], ["Lis Omset", 5]]), ket, reg: "Regional " + (1 + Math.floor(r() * 3)), tren, baru
    });
  }
  return rows;
}
function buildPeriode(id, year, month, n) {
  const rows = genRows(id * 101 + 7, n, year, month), sum = k => rows.reduce((a, x) => a + x[k], 0);
  const otc = sum("psb") + sum("pda");
  return {
    id, year, month, rows, n, baru: rows.filter(x => x.baru).length, unbilled: rows.filter(x => UNBILLED(x.ket)).length,
    b2b: sum("b2b"), wsa: sum("wsa"), shared: sum("shared"), telkom: sum("telkom"), otc, mitra: sum("mitra"), mrc: sum("mitra") - otc
  };
}
// Mei – September 2026 (indeks bulan 4..8)
const periodes = [[4, 1180], [5, 1226], [6, 1291], [7, 1336], [8, 1398]].map((p, i) => buildPeriode(i + 1, 2026, p[0], p[1]));
const label = p => BULAN[p.month] + " " + p.year;
const sortedP = () => [...periodes].sort((a, b) => (b.year * 12 + b.month) - (a.year * 12 + a.month));

/* ============ Views ============ */
const ICON = {
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l3 3v15H6z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h14M14 4l4 4-4 4"/><path d="M20 16H6M10 12l-4 4 4 4"/></svg>',
  pct: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/><path d="M18 6L6 18"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8" r="2.8"/><path d="M3 19c0-3 2.5-5.5 5.5-5.5S14 16 14 19"/><circle cx="16.5" cy="8" r="2.4"/><path d="M14.2 13.6c2.7.3 4.8 2.6 4.8 5.4"/></svg>',
  build: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.8a1 1 0 011-1h4a1 1 0 011 1V7"/><path d="M6 7l1 13.2a1.5 1.5 0 001.5 1.3h7a1.5 1.5 0 001.5-1.3L18 7"/></svg>'
};

function viewIndex() {
  const ps = sortedP(), tM = ps.reduce((a, p) => a + p.mitra, 0), tT = ps.reduce((a, p) => a + p.telkom, 0);
  return `
  <h1>Dashboard Rekon</h1>
  <p class="subtitle">Rekonsiliasi LIS &amp; Billing otomatis — Mitra Contoh A, tidak perlu olah manual di Excel lagi.</p>
  <div class="grid-stats">
    <div class="stat-box navy"><div class="label">Total Periode</div><div class="value">${ps.length}</div></div>
    <div class="stat-box"><div class="label">Total Hak Mitra</div><div class="value">${rp(tM)}</div><div class="sub">akumulasi semua periode</div></div>
    <div class="stat-box green"><div class="label">Total Hak Perusahaan</div><div class="value">${rp(tT)}</div><div class="sub">akumulasi semua periode</div></div>
  </div>
  <div class="card">
    <div class="toolbar"><h2>Daftar Periode</h2><a class="btn" href="#/upload">+ Upload Periode Baru</a></div>
    <ul class="periode-list">${ps.map(p => `
      <li>
        <div>
          <a class="periode-name" href="#/periode/${p.id}">${label(p)}</a>
          <div class="meta"><span class="ok">✓ Sudah diproses</span> · ${num(p.n)} service number · ${num(p.baru)} baru · ${num(p.unbilled)} belum tertagih</div>
        </div>
        <div class="periode-actions">
          <div class="amount">${rp(p.mitra)} <small>hak mitra</small></div>
          <button class="btn secondary" data-ba="${p.id}">Download BA Rekon</button>
          <a class="btn secondary" href="#/periode/${p.id}">Detail</a>
          <button class="btn-icon" data-demo="Hapus dinonaktifkan pada demo." aria-label="Hapus periode">${ICON.trash}</button>
        </div>
      </li>`).join("")}
    </ul>
  </div>`;
}

const D = { id: 0, ket: null, tren: null, q: "", sort: "sn", dir: 1, page: 1 };
const COLS = [["sn", "Service Number"], ["paket", "Paket"], ["sto", "STO"], ["odp", "ODP"], ["b2b", "B2B Cost", 1], ["wsa", "WSA Cost", 1], ["shared", "Shared Billed", 1], ["telkom", "Hak Perusahaan", 1], ["psb", "OTC PSB", 1], ["pda", "OTC PDA", 1], ["mitra", "Hak Mitra", 1], ["tgl", "Tgl PS"], ["lalu", "Status Bulan Lalu"], ["ket", "Status"], ["reg", "Regional"], ["tren", "Tren Revenue"]];

function viewPeriode(id) {
  const p = periodes.find(x => x.id === id); if (!p) return `<p>Periode tidak ditemukan. <a href="#/">Kembali</a></p>`;
  if (D.id !== id) Object.assign(D, { id, ket: null, tren: null, q: "", sort: "sn", dir: 1, page: 1 });
  const ketCount = {}; KET.forEach(k => ketCount[k[0]] = { n: 0, shared: 0 });
  const trenCount = { Naik: 0, Turun: 0, Sama: 0, Baru: 0 };
  p.rows.forEach(r => { ketCount[r.ket].n++; ketCount[r.ket].shared += r.shared; trenCount[r.tren]++; });
  const prorate = p.rows.filter(r => r.baru && r.ket === "Lis_bill").slice(0, 4).map((r, i) => {
    const d = new Date(r.tgl), md = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(), days = md + 1 - d.getDate();
    return { r, days, md, ratio: days / md };
  });
  return `
  <a class="crumb" href="#/">← Semua periode</a>
  <div class="toolbar"><div><h1>Mitra Contoh A — ${label(p)}</h1><p class="subtitle" style="margin:0">${num(p.n)} service number · diproses otomatis dari file LIS &amp; Billing</p></div>
    <div class="periode-actions"><button class="btn secondary" data-ba="${p.id}">Download BA Rekon</button><button class="btn" data-csv="${p.id}">Export CSV</button></div></div>
  <h2 style="margin:22px 0 12px">Rekap Finansial</h2>
  <div class="grid-stats">
    <div class="stat-box navy"><div class="label">${ICON.doc}OTC PSB + PDA</div><div class="value">${rp(p.otc)}</div></div>
    <div class="stat-box navy"><div class="label">${ICON.card}WSA Cost</div><div class="value">${rp(p.wsa)}</div></div>
    <div class="stat-box navy"><div class="label">${ICON.swap}B2B Cost</div><div class="value">${rp(p.b2b)}</div></div>
    <div class="stat-box"><div class="label">${ICON.pct}Hak Mitra MRC</div><div class="value">${rp(p.mrc)}</div></div>
    <div class="stat-box"><div class="label">${ICON.users}Hak Mitra</div><div class="value">${rp(p.mitra)}</div></div>
    <div class="stat-box green"><div class="label">${ICON.build}Hak Perusahaan</div><div class="value">${rp(p.telkom)}</div></div>
  </div>
  <div class="card">
    <div class="toolbar"><h2>Rincian per Status &amp; Tren Revenue</h2><span class="card-note">Klik kartu untuk memfilter tabel di bawah</span></div>
    <div class="sec-label">Status (Ket)</div>
    <div class="pills">
      <button class="pill ${!D.ket ? "on" : ""}" data-ket=""><span class="badge b-gray">Total</span><div class="count">${num(p.n)}</div><div class="sub">${num(p.baru)} baru · ${num(p.unbilled)} belum tertagih</div></button>
      ${KET.map(k => `<button class="pill ${D.ket === k[0] ? "on" : ""}" data-ket="${k[0]}"><span class="badge ${KET_CLASS[k[0]]}">${k[0]}</span><div class="count">${num(ketCount[k[0]].n)}</div><div class="sub">Shared Billed: ${rp(ketCount[k[0]].shared)}</div></button>`).join("")}
    </div>
    <div class="sec-label">Tren Revenue Bulan Ini</div>
    <div class="pills" style="margin:0">${Object.keys(TREN).map(t => `<button class="pill ${D.tren === t ? "on" : ""}" data-tren="${t}"><span class="badge ${TREN[t][0]}">${TREN[t][1]} ${t}</span><div class="count">${num(trenCount[t])}</div></button>`).join("")}</div>
  </div>
  <div class="card">
    <div class="toolbar"><h2>Penyesuaian Prorate</h2><span class="card-note">Nomor yang baru sync tapi Tanggal PS-nya di tengah bulan</span></div>
    <p class="subtitle" style="margin-bottom:12px">Sistem mengusulkan porsi hari secara otomatis (hari masuk ikut dihitung), lalu keputusan akhir ada di tangan reviewer.</p>
    <div class="table-wrap"><table><thead><tr><th>Service Number</th><th>Paket</th><th>Tanggal PS</th><th>Hari Prorate</th><th class="num">Shared Billed (penuh)</th><th class="num">Shared Billed (prorate)</th></tr></thead><tbody>
    ${prorate.map(x => `<tr><td>${x.r.sn}</td><td>${x.r.paket}</td><td>${x.r.tgl}</td><td>${x.days} / ${x.md} hari</td><td class="num">${num(x.r.shared)}</td><td class="num">${num(x.r.shared * x.ratio)}</td></tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="card" id="fixshare">
    <div class="toolbar"><h2>Data Gabungan (Fix Share)</h2><span class="card-note">Hasil pencocokan LIS + Billing per service number</span></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Cari service number…" value="${D.q}" aria-label="Cari service number">
      ${D.ket ? `<span class="chip-on">Status: ${D.ket}<button data-ket="" aria-label="Hapus filter status">×</button></span>` : ""}
      ${D.tren ? `<span class="chip-on">Tren: ${D.tren}<button data-tren="${D.tren}" aria-label="Hapus filter tren">×</button></span>` : ""}
    </div>
    <div id="tbl"></div>
  </div>`;
}

function renderTable() {
  const p = periodes.find(x => x.id === D.id), PER = 12;
  let rows = p.rows.filter(r => (!D.ket || r.ket === D.ket) && (!D.tren || r.tren === D.tren) && (!D.q || r.sn.includes(D.q)));
  rows.sort((a, b) => (a[D.sort] > b[D.sort] ? 1 : a[D.sort] < b[D.sort] ? -1 : 0) * D.dir);
  const pages = Math.max(1, Math.ceil(rows.length / PER)); D.page = Math.min(D.page, pages);
  const view = rows.slice((D.page - 1) * PER, D.page * PER);
  $("#tbl").innerHTML = `<div class="table-wrap"><table><thead><tr>${COLS.map(c => `<th class="${c[2] ? "num" : ""}"><button data-sort="${c[0]}">${c[1]}${D.sort === c[0] ? (D.dir > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}</tr></thead><tbody>
    ${view.length ? view.map(r => `<tr><td>${r.sn}</td><td>${r.paket}</td><td>${r.sto}</td><td>${r.odp}</td><td class="num">${num(r.b2b)}</td><td class="num">${num(r.wsa)}</td><td class="num">${num(r.shared)}</td><td class="num">${num(r.telkom)}</td><td class="num">${num(r.psb)}</td><td class="num">${num(r.pda)}</td><td class="num"><b>${num(r.mitra)}</b></td><td>${r.tgl}</td><td>${r.lalu}</td><td><span class="badge ${KET_CLASS[r.ket]}">${r.ket}</span></td><td>${r.reg}</td><td><span class="badge ${TREN[r.tren][0]}">${TREN[r.tren][1]} ${r.tren}</span></td></tr>`).join("") : `<tr><td colspan="16" style="text-align:center;color:var(--text-muted)">Tidak ada data yang cocok.</td></tr>`}
  </tbody></table></div>
  <div class="pager"><span>Menampilkan ${rows.length ? (D.page - 1) * PER + 1 : 0}–${Math.min(D.page * PER, rows.length)} dari ${num(rows.length)} baris</span>
    <div><button class="btn secondary sm" data-page="-1" ${D.page <= 1 ? "disabled" : ""}>← Sebelumnya</button><button class="btn secondary sm" data-page="1" ${D.page >= pages ? "disabled" : ""}>Berikutnya →</button></div></div>`;
}

function viewRekap() {
  const ps = [...periodes].sort((a, b) => (a.year * 12 + a.month) - (b.year * 12 + b.month)), n = ps.length;
  const W = 900, H = 230, L = 64, R = 130, T = 18, B = 34, pw = W - L - R, ph = H - T - B;
  const max = Math.max(...ps.map(p => Math.max(p.mitra, p.telkom))), step = Math.pow(10, Math.floor(Math.log10(max))) / 2, nice = Math.ceil(max / step) * step;
  const X = i => L + (n > 1 ? i * pw / (n - 1) : pw / 2), Y = v => T + ph - v / nice * ph;
  const path = k => ps.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[k]).toFixed(1)).join(" ");
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${L + pw}" y1="${Y(nice * f)}" y2="${Y(nice * f)}" stroke="#e6e1d6"/><text x="${L - 10}" y="${Y(nice * f) + 4}" text-anchor="end" font-size="11" fill="#726c60">${short(nice * f)}</text>`).join("");
  const last = ps[n - 1];
  const totM = ps.reduce((a, p) => a + p.mitra, 0), totT = ps.reduce((a, p) => a + p.telkom, 0), totN = ps.reduce((a, p) => a + p.n, 0);
  return `
  <h1>Rekap Semua Periode</h1>
  <p class="subtitle">Ringkasan bagi hasil &amp; performansi LIS per periode — Mitra Contoh A</p>
  <div class="grid-stats">
    <div class="stat-box navy"><div class="label">Periode</div><div class="value">${n}</div></div>
    <div class="stat-box"><div class="label">Grand Total Hak Mitra</div><div class="value">${rp(totM)}</div></div>
    <div class="stat-box green"><div class="label">Grand Total Hak Perusahaan</div><div class="value">${rp(totT)}</div></div>
  </div>
  <div class="card">
    <h2>Tren Hak Mitra vs Hak Perusahaan</h2>
    <div class="legend"><span><i style="background:var(--chart-teal)"></i>Hak Mitra</span><span><i style="background:var(--gold)"></i>Hak Perusahaan</span></div>
    <div class="linechart-wrap" id="lc">
      <svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren hak mitra dan hak perusahaan per periode">
        ${grid}
        ${ps.map((p, i) => `<text x="${X(i)}" y="${T + ph + 22}" text-anchor="middle" font-size="11" fill="#726c60">${BULAN[p.month].slice(0, 3)} ${String(p.year).slice(2)}</text>`).join("")}
        <path d="${path("mitra")}" fill="none" stroke="var(--chart-teal)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="${path("telkom")}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>
        ${ps.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.mitra)}" r="4" fill="var(--chart-teal)"/><circle cx="${X(i)}" cy="${Y(p.telkom)}" r="4" fill="var(--gold)"/>`).join("")}
        <text x="${X(n - 1) + 12}" y="${Y(last.mitra) + 4}" font-size="11.5" font-weight="700" fill="#0b6d62">${short(last.mitra)}</text>
        <text x="${X(n - 1) + 12}" y="${Y(last.telkom) + 4}" font-size="11.5" font-weight="700" fill="#9c6c18">${short(last.telkom)}</text>
        ${ps.map((p, i) => `<rect class="band" data-i="${i}" x="${X(i) - pw / n / 2}" y="${T}" width="${pw / n}" height="${ph}" fill="transparent"/>`).join("")}
      </svg>
      <div class="tip" id="tip"></div>
    </div>
  </div>
  <div class="card">
    <h2>Rekap per Periode</h2>
    <div class="table-wrap"><table><thead><tr><th>Periode</th><th class="num">Service Number</th><th class="num">Baru</th><th class="num">Belum Tertagih</th><th class="num">WSA Cost</th><th class="num">B2B Cost</th><th class="num">Hak Mitra</th><th class="num">Hak Perusahaan</th></tr></thead><tbody>
    ${[...ps].reverse().map(p => `<tr><td><a href="#/periode/${p.id}" style="font-weight:700">${label(p)}</a></td><td class="num">${num(p.n)}</td><td class="num">${num(p.baru)}</td><td class="num">${num(p.unbilled)}</td><td class="num">${num(p.wsa)}</td><td class="num">${num(p.b2b)}</td><td class="num"><b>${num(p.mitra)}</b></td><td class="num">${num(p.telkom)}</td></tr>`).join("")}
    <tr style="background:#faf8f3;font-weight:800"><td>Grand Total</td><td class="num">${num(totN)}</td><td class="num"></td><td class="num"></td><td class="num"></td><td class="num"></td><td class="num">${num(totM)}</td><td class="num">${num(totT)}</td></tr>
    </tbody></table></div>
  </div>`;
}

const STEPS = ["Membaca file LIS & Billing", "Mencocokkan service number", "Mengklasifikasi status (Lis_bill, Unbilled, …)", "Menghitung bagi hasil & rekap"];
function viewUpload() {
  const used = periodes.some(p => p.year === 2026 && p.month === 9);
  return `
  <h1>Upload Periode Baru</h1>
  <p class="subtitle">Upload file export LIS &amp; Billing bulan berjalan. Sistem akan otomatis menggabungkan, mencocokkan, mengklasifikasi, dan menghitung bagi hasil.</p>
  <div class="card">
    <h2>Form Upload</h2>
    <div class="form-grid">
      <div><label>Mitra</label><select disabled><option>Mitra Contoh A</option></select></div>
      <div><label>Periode Billing</label><select disabled><option>Oktober 2026</option></select></div>
      <div><label>File Export LIS</label><div class="file"><b>lis_contoh_okt2026.xlsx</b>file contoh (demo)</div></div>
      <div><label>File Export Billing</label><div class="file"><b>billing_contoh_okt2026.xlsx</b>file contoh (demo)</div></div>
    </div>
    ${used ? `<p class="note">Periode Oktober 2026 sudah diproses pada demo ini. <a href="#/">Lihat di dashboard →</a></p>` :
      `<button class="btn" id="run">Proses rekonsiliasi (pakai file contoh)</button>`}
    <ul class="steps" id="steps" hidden>${STEPS.map(s => `<li><span class="ic"></span>${s}</li>`).join("")}</ul>
    <p class="note">Pada demo ini tidak ada file yang diunggah. Data hasil rekonsiliasi dibuat otomatis sebagai contoh.</p>
  </div>`;
}

/* ============ Router & events ============ */
function route() {
  const h = location.hash || "#/", app = $("#app");
  let page = "index";
  if (h.startsWith("#/periode/")) { page = "periode"; app.innerHTML = viewPeriode(+h.split("/")[2]); renderTable(); }
  else if (h === "#/upload") { page = "upload"; app.innerHTML = viewUpload(); }
  else if (h === "#/rekap") { page = "rekap"; app.innerHTML = viewRekap(); bindChart(); }
  else app.innerHTML = viewIndex();
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.p === (page === "periode" ? "index" : page)));
  window.scrollTo(0, 0);
}
function bindChart() {
  const ps = [...periodes].sort((a, b) => (a.year * 12 + a.month) - (b.year * 12 + b.month)), tip = $("#tip"), wrap = $("#lc"), svg = wrap.querySelector("svg");
  svg.querySelectorAll(".band").forEach(b => {
    b.addEventListener("mouseenter", () => {
      const p = ps[+b.dataset.i], bb = b.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
      tip.innerHTML = `<b>${label(p)}</b><br>Hak Mitra: ${rp(p.mitra)}<br>Hak Perusahaan: ${rp(p.telkom)}`;
      tip.style.left = (bb.left + bb.width / 2 - wb.left) + "px"; tip.style.top = (bb.top - wb.top + 20) + "px"; tip.style.opacity = 1;
    });
    b.addEventListener("mouseleave", () => tip.style.opacity = 0);
  });
}
function openBA(id) {
  const p = periodes.find(x => x.id === id);
  $("#paper").innerHTML = `
    <h3>BERITA ACARA REKONSILIASI</h3>
    <div class="no">Periode ${label(p)} · Mitra Contoh A · No. BA-DEMO/${p.year}/${String(p.month + 1).padStart(2, "0")}</div>
    <p>Pada hari ini telah dilakukan rekonsiliasi data LIS dan Billing untuk periode <b>${label(p)}</b> dengan hasil sebagai berikut:</p>
    <table><tbody>
      <tr><td>Jumlah service number</td><td class="num">${num(p.n)}</td></tr>
      <tr><td>Hak Mitra</td><td class="num"><b>${rp(p.mitra)}</b></td></tr>
      <tr><td>Hak Perusahaan</td><td class="num"><b>${rp(p.telkom)}</b></td></tr>
    </tbody></table>
    <p>Terbilang hak mitra: <i>${terbilang(p.mitra)} rupiah</i>.</p>
    <div class="sign"><div>Pihak Mitra<span></span>(Nama PIC Mitra)</div><div>Pihak perusahaan<span></span>(Nama PIC Perusahaan)</div></div>
    <div class="paper-actions"><span>Pada aplikasi asli, file .docx dibuat otomatis dari template.</span><button class="btn secondary sm" data-close>Tutup</button></div>`;
  $("#modal").hidden = false;
}
function csv(id) {
  const p = periodes.find(x => x.id === id), head = COLS.map(c => c[1]).join(",");
  const lines = p.rows.map(r => COLS.map(c => typeof r[c[0]] === "number" ? Math.round(r[c[0]]) : r[c[0]]).join(","));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([head + "\n" + lines.join("\n")], { type: "text/csv" }));
  a.download = "demo-fix-share-" + label(p).replace(" ", "-") + ".csv"; a.click(); URL.revokeObjectURL(a.href);
}
async function runUpload() {
  $("#run").disabled = true; const ul = $("#steps"); ul.hidden = false; const li = [...ul.children];
  for (let i = 0; i < li.length; i++) { li[i].className = "run"; await new Promise(r => setTimeout(r, 650)); li[i].className = "done"; li[i].querySelector(".ic").textContent = "✓"; }
  const p = buildPeriode(periodes.length + 1, 2026, 9, 1452); periodes.push(p);
  toast("Periode Oktober 2026 selesai diproses (data dummy)."); setTimeout(() => { location.hash = "#/periode/" + p.id; }, 500);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.ba) openBA(+t.dataset.ba);
  else if (t.dataset.csv) csv(+t.dataset.csv);
  else if (t.dataset.demo) toast(t.dataset.demo);
  else if (t.id === "run") runUpload();
  else if (t.hasAttribute("data-close")) $("#modal").hidden = true;
  else if (t.dataset.ket !== undefined) { D.ket = t.dataset.ket || null; D.page = 1; reRender(); }
  else if (t.dataset.tren !== undefined) { D.tren = D.tren === t.dataset.tren ? null : t.dataset.tren; D.page = 1; reRender(); }
  else if (t.dataset.sort) { D.dir = D.sort === t.dataset.sort ? -D.dir : 1; D.sort = t.dataset.sort; renderTable(); }
  else if (t.dataset.page) { D.page += +t.dataset.page; renderTable(); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") e.target.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").hidden = true; });
document.addEventListener("input", e => { if (e.target.id === "q") { D.q = e.target.value.trim(); D.page = 1; renderTable(); } });
function reRender() { const y = scrollY; $("#app").innerHTML = viewPeriode(D.id); renderTable(); scrollTo(0, y); }
addEventListener("hashchange", route); route();
</script>
</body>
</html>
